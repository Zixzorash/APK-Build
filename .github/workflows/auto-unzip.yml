name: Manual Extract ZIP

on:
  workflow_dispatch: # ใช้คำสั่งนี้เพื่อให้มีปุ่ม "Run workflow" ให้กดด้วยตัวเอง

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ให้สิทธิ์ในการ commit ไฟล์กลับ

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files to root
        run: |
          # ตรวจสอบว่ามีไฟล์ .zip อยู่ในโฟลเดอร์ zip/ หรือไม่
          if ls zip/*.zip 1> /dev/null 2>&1; then
            for f in zip/*.zip; do
              echo "Unzipping $f to root directory..."
              # -o คือเขียนทับไฟล์เดิม, -d . คือให้แตกลงที่ root directory
              unzip -o "$f" -d .
              
              # หากต้องการให้ระบบลบไฟล์ zip ต้นฉบับทิ้งหลังจากแตกไฟล์เสร็จ ให้เอาเครื่องหมาย # ด้านล่างออก
              # git rm "$f"
            done
          else
            echo "No ZIP files found in zip/ directory. Nothing to extract."
          fi

      - name: Commit and push extracted files
        run: |
          # ตั้งค่าชื่อ Bot สำหรับทำการ Commit
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add ไฟล์ทั้งหมดที่ถูกแตกออกมา
          git add .
          
          # ตรวจสอบว่ามีไฟล์ใหม่เกิดขึ้นจริงหรือไม่
          if ! git diff-index --quiet HEAD; then
            git commit -m "Manually extracted zip files to root"
            git push
          else
            echo "No changes to commit"
          fi
