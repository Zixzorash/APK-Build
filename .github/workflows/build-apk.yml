name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["*.zip"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract project zip
        run: |
          shopt -s nullglob
          for z in *.zip; do echo "Extracting $z"; unzip -oq "$z" -d _src; done
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          
      - name: Locate project
        run: |
          F=$(find . -name "settings.gradle*" -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then echo "::error::settings.gradle not found."; exit 1; fi
          echo "P=$(dirname "$F")" >> "$GITHUB_ENV"
          
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          
      - name: Prepare Resources & Build Environment
        run: |
          cd "$P"
          
          # สร้าง Debug Keystore สำหรับเซ็นชื่อแอพ
          [ -f debug.keystore ] || keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # สร้างโครงสร้างโฟลเดอร์ res/ จำลองเพื่อป้องกัน AAPT2 Error
          RES="app/src/main/res"
          mkdir -p "$RES/values" "$RES/xml" "$RES/drawable"
          
          cat <<EOF > "$RES/values/strings.xml"
          <resources><string name="app_name">APK Builder Pro</string></resources>
          EOF
          
          cat <<EOF > "$RES/values/themes.xml"
          <resources><style name="Theme.APKBuilderPro" parent="android:Theme.DeviceDefault.NoActionBar" /></resources>
          EOF
          
          cat <<EOF > "$RES/xml/backup_rules.xml"
          <full-backup-content/>
          EOF
          
          cat <<EOF > "$RES/xml/data_extraction_rules.xml"
          <data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>
          EOF
          
          # ปรับ AndroidManifest.xml ให้ชี้ไปที่ไอคอนพื้นฐานของระบบ
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@android:drawable\/sym_def_app_icon"/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' app/src/main/AndroidManifest.xml || true
          
      - name: Build debug APK
        run: |
          cd "$P"
          # สั่งคอมไพล์ผ่านคำสั่ง gradle โดยตรงเนื่องจากไม่มี gradlew ในโปรเจกต์ต้นฉบับ
          gradle assembleDebug --no-daemon --stacktrace
          
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
